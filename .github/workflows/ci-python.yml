name: CI — Python (SDK + brains)

on:
  push:
    branches: [main, dev]
    paths:
      - 'sdk/**'
      - 'agent-pod/brain/**'
  pull_request:
    branches: [main, dev]
    paths:
      - 'sdk/**'
      - 'agent-pod/brain/**'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "sdk/python[dev]" -r agent-pod/brain/requirements.txt

      - name: Run linter
        run: |
          pip install flake8
          flake8 sdk/ --max-line-length=120 --ignore=E501,W503 --exclude='*_pb2*.py,.venv'

      - name: Run SDK tests
        run: pytest sdk/python/tests -v --tb=short

      - name: Run brain tests
        env:
          PYTHONPATH: agent-pod/brain
        run: pytest agent-pod/brain/tests -v --tb=short
