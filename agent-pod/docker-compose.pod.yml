version: "3.8"

x-common: &common
  restart: unless-stopped
  networks: [pod-internal]

services:
  # 1. Financial Pod (Go Daemon)
  financial-pod:
    <<: *common
    build:
      context: ./financial-pod
      dockerfile: Dockerfile
    command: ["financialpod", "--config", "/config/config.yaml"]
    volumes:
      - ./config/${AGENT_NAME}:/config:ro
      - ledger-data:/data
    ports:
      - "${GRPC_PORT:-6001}:6001"
    environment:
      # Developer's Custom Agent Brain address
      - BRAIN_ADDR=${BRAIN_ADDR:-host.docker.internal:50052}
    depends_on:
      lnd-node:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:6001"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 2. Lightning Node (LND)
  lnd-node:
    <<: *common
    image: lightninglabs/lnd:v0.17.0-beta
    command: ["lnd", "--configfile=/config/lnd.conf"]
    volumes:
      - ./config/${AGENT_NAME}/lnd:/config:ro
      - lnd-data:/root/.lnd
    ports:
      - "${LND_GRPC_PORT:-10009}:10009"
      - "${LND_REST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "lncli", "--rpcserver=localhost:10009", "getinfo"]
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  ledger-data:
  lnd-data:

networks:
  pod-internal:
    driver: bridge
